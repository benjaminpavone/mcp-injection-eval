[project]
name = "mcp-injection-eval"
version = "0.1.0"
description = "Prompt-injection benchmark for tool-using LLM agents connected through MCP"
readme = "README.md"
license = "MIT"
authors = [{ name = "Benjamin Pavone" }]
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py314"
